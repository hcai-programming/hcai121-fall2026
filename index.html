<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programming for AI 1 · HCAI 121 · Fall 2026</title>
<meta name="description" content="A first course in Python programming and the problem-solving skills for working with AI.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff;
    --ink:#20201d;
    --soft:#4a4842;
    --muted:#8b877d;
    --accent:#8a2a2e;        /* a quiet, deep academic red */
    --rule:#e7e4dd;
    --rule-soft:#efece5;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:0 28px}
  a{color:inherit}

  /* header */
  header{padding:64px 0 30px}
  .eyebrow{
    font-family:var(--sans);font-size:12.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);margin:0 0 16px;
  }
  h1{
    font-family:var(--serif);font-weight:600;
    font-size:clamp(30px,5vw,44px);line-height:1.12;letter-spacing:-.01em;
    margin:0 0 16px;
  }
  .lead{
    font-family:var(--serif);font-size:20px;line-height:1.5;
    color:var(--soft);max-width:56ch;margin:0;
  }
  .lead strong{font-weight:600;color:var(--ink)}

  /* meta */
  .meta{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-top:34px}
  .meta .wrap{display:flex;flex-wrap:wrap;gap:0 48px;padding-top:0;padding-bottom:0}
  .meta dl{margin:0;padding:18px 0}
  .meta dt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .meta dd{margin:0;font-size:15px;color:var(--ink)}

  /* quick links */
  .links{padding:26px 0 4px}
  .links ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 26px}
  .links a{
    font-size:15px;text-decoration:none;color:var(--accent);
    border-bottom:1px solid transparent;padding-bottom:1px;
    transition:border-color .12s;
  }
  .links a:hover,.links a:focus-visible{border-bottom-color:var(--accent)}

  /* important dates */
  .dates{padding:44px 0 64px}
  .dates-title{
    font-family:var(--serif);font-weight:600;font-size:18px;
    margin:0 0 4px;padding-bottom:10px;border-bottom:2px solid var(--ink);
  }
  .date-list{list-style:none;margin:0;padding:0}
  .date-list li{
    display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    padding:12px 4px;border-bottom:1px solid var(--rule);
  }
  .date-list .name{font-family:var(--serif);font-size:16px;color:var(--ink)}
  .date-list .when{font-size:14px;color:var(--muted);white-space:nowrap}

  /* schedule */
  .schedule{padding:40px 0 8px}
  .part{margin:0 0 4px}
  .part:not(:first-child){margin-top:44px}
  .part-label{
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:0 0 5px;
  }
  .part-title{
    font-family:var(--serif);font-weight:600;font-size:24px;
    margin:0 0 4px;padding-bottom:12px;border-bottom:2px solid var(--ink);
  }

  .week{
    display:grid;grid-template-columns:78px 1fr auto;
    align-items:baseline;gap:4px 20px;
    text-decoration:none;color:inherit;
    padding:15px 4px;border-bottom:1px solid var(--rule);
    transition:background .1s;
  }
  .week:hover,.week:focus-visible{background:var(--rule-soft);outline:none}
  .wk{font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .week:hover .wk,.week:focus-visible .wk{color:var(--accent)}
  .topic{font-family:var(--serif);font-size:18px;line-height:1.35;color:var(--ink)}
  .topic .detail{display:block;font-family:var(--sans);font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .tag{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:2px;white-space:nowrap;border:1px solid var(--rule)}
  .tag.policy{color:var(--muted);background:var(--bg)}
  .tag.flag{color:#fff;background:var(--accent);border-color:var(--accent)}

  .exam{
    display:flex;align-items:baseline;gap:16px;
    padding:16px 4px;border-bottom:1px solid var(--rule);
  }
  .exam .badge{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);font-weight:600;white-space:nowrap}
  .exam .exam-note{font-size:14px;color:var(--muted)}

  /* footer */
  footer{border-top:1px solid var(--rule);margin-top:48px;padding:30px 0 64px;color:var(--muted);font-size:14px}
  footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:baseline}
  footer .note{max-width:54ch;line-height:1.55}
  footer a{color:var(--soft);text-decoration:none;border-bottom:1px solid var(--rule)}
  footer a:hover{border-bottom-color:var(--accent);color:var(--accent)}

  @media (max-width:600px){
    .wrap{padding:0 20px}
    .week{grid-template-columns:66px 1fr}
    .tags{grid-column:2;justify-content:flex-start;margin-top:5px}
    .meta .wrap{gap:0 30px}
  }
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Programming for AI 1</h1>
    <p class="lead">This course is designed for students with little to no prior programming experience to build a solid foundation in Python programming and the problem-solving skills essential for working with AI.</p>
  </div>
</header>

<nav class="links" aria-label="Course resources">
  <div class="wrap"><ul id="quicklinks"></ul></div>
</nav>

<main class="schedule">
  <div class="wrap" id="schedule"></div>
</main>

<section class="dates" aria-label="Important dates">
  <div class="wrap">
    <h2 class="dates-title">Important dates</h2>
    <ul id="keydates" class="date-list"></ul>
  </div>
</section>


<script>
/* =========================================================================
   EDIT HERE — everything renders from this config.
   ========================================================================= */

const REPO_BASE = "https://github.com/hcai-programming/hcai121-fall2026";

const QUICK_LINKS = [
  { label: "Syllabus",        href: "#", key: "syllabus" },
  { label: "Think Python",    href: "https://greenteapress.com/wp/think-python-3rd-edition/" },
  { label: "Weekly question", href: "#" },   // ELMS survey
];

// Important dates — edit names and fill in dates when you know them.
const KEY_DATES = [
  { name: "No class — Labor Day",          when: "Sep 7" },
  { name: "No class — Fall break",         when: "Oct 12" },
  { name: "No class — Thanksgiving break", when: "Nov 25" },
  { name: "Exam week",                     when: "Dec 14–21" },
];

// part: new section · week: a class week (slug builds the repo link)
// tag classes: policy (grey) | flag (accent) · exam: a checkpoint row
const SCHEDULE = [
  { part: "Part 1", title: "Programming fundamentals" },
  { week: 1, slug: "week01", topic: "Getting started with Python",
    detail: "Setup and Jupyter · first programs · variables and types",
    tags: [["No LLM","policy"]] },
  { week: 2, slug: "week02", topic: "Variables, types, input & output",
    detail: "Ints, floats, strings, booleans · f-strings & formatted output · comments",
    tags: [["No LLM","policy"]] },
  { week: 3, slug: "week03", topic: "Conditionals & Boolean logic",
    detail: "Decision-making programs · truth tables",
    tags: [["No LLM","policy"]] },
  { week: 4, slug: "week04", topic: "Loops & accumulation patterns",
    detail: "for / while · sum, min, max · loop invariants",
    tags: [["No LLM","policy"]] },
  { week: 5, slug: "week05", topic: "Functions: arguments, return, scope",
    detail: "Decomposition and testable design",
    tags: [["Project 1 · Hangman","flag"],["No LLM","policy"]] },

  { part: "Part 2", title: "Data structures & data handling" },
  { week: 6, slug: "week06", topic: "Lists & tuples",
    detail: "Indexing, slicing, mutability",
    tags: [["No LLM","policy"]] },
  { week: 7, slug: "week07", topic: "Dictionaries & sets",
    detail: "Key–value mappings · build a preference profile",
    tags: [["No LLM","policy"]] },
  { exam: "Midterm exam", note: "in person · covers Weeks 1–7" },
  { week: 8, slug: "week08", topic: "Files & CSV",
    detail: "Reading and writing data · simple statistics",
    tags: [["LLM w/ Citation","policy"]] },
  { week: 9, slug: "week09", topic: "Comprehensions & higher-order functions",
    detail: "map, filter, lambda · making code more Pythonic",
    tags: [["LLM as Object","policy"]] },

  { part: "Part 3", title: "Object-oriented programming" },
  { week: 10, slug: "week10", topic: "Classes & objects",
    detail: "Attributes, methods · writing tests for an interaction",
    tags: [["No LLM","policy"]] },
  { week: 11, slug: "week11", topic: "OOP design",
    detail: "Composition vs. inheritance · encapsulation",
    tags: [["Project 2","flag"],["LLM w/ Citation","policy"]] },

  { part: "Part 4", title: "Programming with AI tools" },
  { week: 12, slug: "week12", topic: "Prompting & AI coding tools",
    detail: "Writing clear specs · giving examples and tests · chat vs. autocomplete vs. agents",
    tags: [["LLM as Object","policy"]] },
  { week: 13, slug: "week13", topic: "Evaluating & debugging AI-generated code",
    detail: "Finding subtle bugs and unstated assumptions · verifying with tests · when to trust it",
    tags: [["LLM as Object","policy"]] },
  { week: 14, slug: "week14", topic: "Final project",
    detail: "Building with AI assistance",
    tags: [["Final project","flag"],["LLM w/ Citation","policy"]] },
  { week: 15, slug: "week15", topic: "Final project: presentations & review",
    detail: "Presentations · reflection & write-up · course review",
    tags: [["Final project","flag"],["LLM w/ Citation","policy"]] },
  { exam: "Final exam", note: "in person · during exam week" },
];

/* =========================================================================
   Rendering — no need to edit below.
   ========================================================================= */
(function () {
  const syl = QUICK_LINKS.find(l => l.key === "syllabus");

  document.getElementById("quicklinks").innerHTML =
    QUICK_LINKS.map(l => `<li><a href="${l.href}" target="_blank" rel="noopener">${l.label}</a></li>`).join("");

  document.getElementById("keydates").innerHTML =
    KEY_DATES.map(d => `<li><span class="name">${d.name}</span><span class="when">${d.when}</span></li>`).join("");

  const pad = n => String(n).padStart(2, "0");
  let html = "";

  for (const item of SCHEDULE) {
    if (item.part) {
      html += `<section class="part">
        <p class="part-label">${item.part}</p>
        <h2 class="part-title">${item.title}</h2>
      </section>`;
    } else if (item.exam) {
      html += `<div class="exam">
        <span class="badge">${item.exam}</span>
        <span class="exam-note">${item.note || ""}</span>
      </div>`;
    } else {
      const href = `${REPO_BASE}/tree/main/${item.slug}`;
      const wk = typeof item.week === "number" ? `Week ${pad(item.week)}` : `Weeks ${item.week}`;
      const tags = (item.tags || [])
        .map(([label, cls]) => `<span class="tag ${cls}">${label}</span>`).join("");
      html += `<a class="week" href="${href}" target="_blank" rel="noopener">
        <span class="wk">${wk}</span>
        <span class="topic">${item.topic}${item.detail ? `<span class="detail">${item.detail}</span>` : ""}</span>
        <span class="tags">${tags}</span>
      </a>`;
    }
  }
  document.getElementById("schedule").innerHTML = html;

  document.querySelectorAll('[data-link="syllabus"]').forEach(a => {
    if (syl && syl.href && syl.href !== "#") a.href = syl.href;
  });
})();
</script>
</body>
</html>
